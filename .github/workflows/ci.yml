name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write  # for SARIF upload

jobs:
  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on all PR commits
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0
          while IFS= read -r sha; do
            body=$(git log --format=%B -1 "$sha")
            if ! printf '%s\n' "$body" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "ERROR: commit $sha missing Signed-off-by trailer"
              git log --oneline -1 "$sha"
              failed=1
            fi
          done < <(git log --format='%H' "${base}".."${head}")
          exit $failed

  build-and-test:
    name: Build & Test (Java ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java: [21]
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn -q clean package -DskipTests -B

      - name: Unit Tests
        run: mvn -q test -B

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      - name: Gate check (jfusa check)
        if: matrix.os == 'ubuntu-latest'
        run: java -jar target/jfusa.jar check --format=json --output=fusa-report.json
        continue-on-error: true

      - name: Lint check
        if: matrix.os == 'ubuntu-latest'
        run: java -jar target/jfusa.jar lint
        continue-on-error: true

      - name: Security check
        if: matrix.os == 'ubuntu-latest'
        run: java -jar target/jfusa.jar cyber --format=sarif --output=fusa-security.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Code Scanning
        if: matrix.os == 'ubuntu-latest' && hashFiles('fusa-security.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: fusa-security.sarif
        continue-on-error: true

      - name: Tool qualification
        if: matrix.os == 'ubuntu-latest'
        run: java -jar target/jfusa.jar qualify

      - name: Generate evidence artifacts
        if: matrix.os == 'ubuntu-latest'
        run: |
          java -jar target/jfusa.jar verify
          java -jar target/jfusa.jar release
          java -jar target/jfusa.jar audit-pack

      - name: Upload evidence artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: evidence-artifacts
          path: |
            fusa-report.json
            qualify-report.json
            sbom.json
            provenance.json
            .fusa-evidence.json
            audit-pack.zip
          if-no-files-found: warn
          retention-days: 90

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghcr.io/soundmatt/java-fusa:latest
          build-args: |
            VERSION=0.5.0
            SPEC_VERSION=1.14.0
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
